<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันการสั่งซื้อ — AXIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ Header ============ -->
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">AXIS</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้าทั้งหมด</a></li>
      </ul>
    </nav>
  </header>

  <!-- ============ Order form ============ -->
  <section>
    <div class="container container-narrow">
      <p class="eyebrow text-center">Checkout</p>
      <h2 class="section-heading center text-center">ยืนยันการสั่งซื้อ</h2>

      <form id="orderForm" class="order-form">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="4" placeholder="ที่อยู่จัดส่ง หรือรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
        </div>

        <button type="submit" class="btn btn-accent btn-block">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </section>

  <!-- ============ Footer ============ -->
  <footer class="site-footer">
    <span class="logo">AXIS</span>
    <ul class="footer-links">
      <li><a href="index.html">หน้าแรก</a></li>
      <li><a href="product.html">สินค้าทั้งหมด</a></li>
    </ul>
    <p class="footer-note">&copy; 2026 AXIS. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
